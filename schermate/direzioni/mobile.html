<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Studio Mobile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600&display=swap">
<style>html,body{margin:0;background:#000}</style>
</head>
<body>
<div class="dirA" id="root"></div>
<script src="comune.js"></script>
<script src="../componenti.js"></script>
<script src="avatar/avatar-motore.js"></script>
<script src="avatar/avatar-dgt.js"></script>
<script src="avatar/avatar-orbe.js"></script>
<script src="dati.js"></script>
<script src="mobile.js"></script>
<script>
  // Parametri: ?schermata=1|…|8 (uno o più telefoni, es. ?schermata=2 o ?schermata=1,4; predefinito 1,…,8: gli otto telefoni)
  // 1 Da approvare · 2 Richiesta · 3 Riepilogo di oggi · 4 Chat · 5 Conversazione · 6 Agenda · 7 Dipartimenti · 8 Dipartimento.
  // ?richiesta=0 (indice nella coda)  ?filo=<id dipendente>  ?dip=svi|mkt|ven|amm (il dipartimento della schermata 8)
  // ?quadro=0|1|2|3 il quadro del giorno in cima alla schermata 1 (versione 17). Scelta: 2 «due per due»; 1 «le quattro a due piani» e 3 «la riga che parla» sono le forme scartate dello studio; 0 = niente, il telefono di prima
  // ?conta=0|1|2 la misura del conto nel titolo della schermata 1 (solo col quadro 2): 1 come il titolo (26, la scelta), 2 la strada di mezzo (numero a 36), 0 rimette la riga dei due numeri grandi
  // ?n=11|40 e gli stessi parametri dell'avatar della Console (?avatar= ?pelle= ?identita= ?palette= ?corpo= ?occhi= ?segnale= ?carattere=)
  const q = new URLSearchParams(location.search);
  DGT_UI.iconeInserisci();
  DGT_AVATAR.usa(q.get('avatar') || 'orbe');
  DGT_AVATAR.pelle(q.get('pelle') || 'perla');
  // lo stesso aspetto degli avatar della Console (versione 10, «strada 1»): dischi piatti nella tinta del dipendente, occhi lilguy, punto di stato
  DGT_AVATAR_ORBE.aspetto({ identita: q.get('identita') || 'tinta', palette: q.get('palette') || 'vivace', finitura: q.get('corpo') || 'piatta', occhi: q.get('occhi') || 'lilguy', segnale: q.get('segnale') || 'punto', carattere: q.get('carattere') === '1' });
  DGT_UI.stile('css-componenti', DGT_COMPONENTI.css);   // i componenti condivisi con la Console (schermate/componenti.js, classi .dirA)
  DGT_UI.stile('css-m', DGT_MOBILE.css);    // le cornici del telefono e le tre schermate
  const modello = DGT_DATI.modello(DGT_DATI.nDaUrl());
  const schermate = (q.get('schermata') || '1,2,3,4,5,6,7,8').split(',').map(Number).filter(s => s >= 1 && s <= 8);
  DGT_MOBILE.monta(document.getElementById('root'), modello, { schermate, richiesta: +(q.get('richiesta') || 0), filo: +(q.get('filo') || 0), dip: q.get('dip') || '', quadro: q.has('quadro') ? +q.get('quadro') : undefined, conta: q.has('conta') ? +q.get('conta') : undefined });
</script>
</body>
</html>
