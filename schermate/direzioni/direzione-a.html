<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Nova Studio Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600&display=swap">
<style>html,body{margin:0;background:#000}</style>
</head>
<body>
<div class="dirA" id="root"></div>
<script src="comune.js"></script>
<script src="../componenti.js"></script>
<script src="avatar/avatar-motore.js"></script>
<script src="avatar/avatar-dgt.js"></script>
<script src="avatar/avatar-orbe.js"></script>
<script src="dati.js"></script>
<script src="direzione-a.js"></script>
<script>
  // Parametri: ?n=11|40  ?tendina=chiusa|aperta|estesa|dossier  ?pannello=richieste|riepilogo  ?pagina=home|richieste|dipartimento|dipendente|esecuzione|consegna|workflow|costi|agenda|chat  ?dip=svi|mkt|ven|amm  ?id=<id dipendente>  ?filo=<id dipendente, pagina chat>  ?barra=0 (la barra «Oggi in azienda» di prima, versione 15, per il confronto)  ?confronto=6,7  ?richiesta=0  ?pagina=consegna&consegna=<id, es. c1-0> (la pagina della consegna, versione 19)  ?pagina=workflow&dip=<dip> (l'elenco) oppure ?pagina=workflow&workflow=<id, es. w1>&nodo=<n> (il canvas, versione 20)  ?editor=nuovo|<id dipendente>  ?avatar=orbe|kit  ?pelle=perla|grigio|chiaro|alone|disco  ?identita=tinta|dipartimento|toni|nessuna  ?palette=vivace|pastello|scura  ?corpo=piatta|orlo|perla  ?occhi=lilguy|neri|colorati|punti|kit  ?segnale=nessuno|punto|anello|gesto  ?carattere=1
  const q = new URLSearchParams(location.search);
  DGT_UI.iconeInserisci();
  DGT_AVATAR.usa(q.get('avatar') || 'orbe');   // ?avatar=kit per le forme del kit
  DGT_AVATAR.pelle(q.get('pelle') || 'perla');   // la pelle dell'orbe quando il corpo non ha tinta: perla (predefinita), grigio, chiaro, alone, disco
  // L'aspetto scelto dall'utente (2026-09-05, versione 10, «strada 1»): dischi piatti nella tinta del dipendente, palette vivace,
  // occhi lilguy con sclera bianca e pupilla nera; lo stato è un punto sul bordo (nelle pile il gesto del corpo, vedi pair() in
  // direzione-a.js). ?identita=nessuna&occhi=kit&corpo=perla&segnale=nessuno riporta all'orbe di prima.
  DGT_AVATAR_ORBE.aspetto({ identita: q.get('identita') || 'tinta', palette: q.get('palette') || 'vivace', finitura: q.get('corpo') || 'piatta', occhi: q.get('occhi') || 'lilguy', segnale: q.get('segnale') || 'punto', carattere: q.get('carattere') === '1' });
  DGT_UI.stile('css-componenti', DGT_COMPONENTI.css);   // i componenti condivisi (schermate/componenti.js), prima del CSS della Console
  DGT_UI.stile('css-a', DIREZIONE_A.css);
  const root = document.getElementById('root');
  const modello = DGT_DATI.modello(DGT_DATI.nDaUrl());
  DIREZIONE_A.monta(root, modello, {
    pagina: q.get('pagina') || 'home', dip: q.get('dip') || 'svi', id: +(q.get('id') || 4), richiesta: +(q.get('richiesta') || 0),
    pannello: q.get('pannello') || 'richieste', editor: q.get('editor'), confronto: q.get('confronto'), filo: +(q.get('filo') || 0), barra: q.get('barra') || '',
    consegna: q.get('consegna') || '', workflow: q.get('workflow') || '', nodo: +(q.get('nodo') || 0), tendina: q.get('tendina') || 'aperta' });
  // La Console è progettata a 1440 px e riempie sempre la larghezza dello schermo: sopra i 1440 si ingrandisce, sotto si riduce
  // (richiesta dell'utente, 2026-09-04). Si usa `zoom`, non `transform`: così le tendine e le pillole fisse restano al bordo dello
  // schermo e non scorrono con la pagina; i 100vh delle tendine si dividono per --z (vedi il CSS in direzione-a.js).
  function scala() { const s = document.documentElement.clientWidth / 1440; root.style.zoom = s; root.style.setProperty('--z', s); }
  window.addEventListener('resize', scala); scala();
</script>
</body>
</html>
